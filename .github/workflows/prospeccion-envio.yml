name: Prospección · turno de envío
on:
  schedule:
    - cron: '50 14-21 * * *'   # cada hora de 9:50 am a 4:50 pm (Florida)
  workflow_dispatch:
permissions:
  id-token: write   # token para que el bot sepa que es esta tarea (sin claves guardadas)
  contents: read
concurrency: prospeccion-envio
jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir al bot que envíe el turno de esta hora
        run: |
          T=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dgp-prospeccion" | jq -r .value)
          curl -sS --max-time 500 -X POST https://ayudante-dgp-bot.dgpgroupusa-llc.workers.dev/prospeccion \
            -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"accion":"turno"}' | jq '{paso, horaFL, cupo, enviadosAntes, seguimientos, nuevos, recuperados, total, errores: (.errores // [] | length)}'
