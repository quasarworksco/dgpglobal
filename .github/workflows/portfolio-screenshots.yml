name: Portfolio screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - _data/portfolio.json
      - scripts/screenshots.mjs
      - .github/workflows/portfolio-screenshots.yml
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and sharp
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2 sharp@0.33.5
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node scripts/screenshots.mjs
      - name: Commit screenshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update portfolio screenshots"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't start a Pages build on their own
      - name: Request Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; next push will publish the screenshots"
