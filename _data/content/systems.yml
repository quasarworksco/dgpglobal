faq:
- q_es: ¿Cuánto cuesta un sistema personalizado?
  a_es: Cada sistema se cotiza según su alcance. Nos cuentas tu idea y te enviamos una propuesta personalizada con precio, tiempo de entrega y todo lo que incluye, sin letras pequeñas.
  q_en: How much does a custom system cost?
  a_en: Each system is quoted based on its scope. Tell us your idea and we'll send you a custom proposal with price, delivery time and everything included, no fine print.
- q_es: ¿Qué tipo de sistemas desarrollan?
  a_es: Paneles de administración, facturación y pagos, portales de reservas, apps web, integraciones con APIs, automatizaciones, sistemas de turnos, membresías y más.
  q_en: What kind of systems do you build?
  a_en: Admin dashboards, billing and payments, booking portals, web apps, API integrations, automations, scheduling systems, memberships and more.
- q_es: ¿Usan plantillas?
  a_es: No. Analizamos tu proceso, diseñamos la solución y la construimos desde cero. Cada sistema es único, como tu negocio.
  q_en: Do you use templates?
  a_en: No. We analyze your process, design the solution and build it from scratch. Every system is unique, like your business.
- q_es: ¿Dan soporte después de entregar el sistema?
  a_es: Sí. Incluimos soporte post-entrega para ajustes, dudas y cambios.
  q_en: Do you provide support after delivery?
  a_en: Yes. We include post-delivery support for adjustments, questions and changes.
