faq:
- q_es: ¿Tienen oficina en Miami?
  a_es: 'Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte. Atendemos negocios de todo Miami-Dade.'
  q_en: Do you have an office in Miami?
  a_en: 'We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere. We serve businesses across Miami-Dade.'
- q_es: ¿La página puede estar en español y en inglés?
  a_es: Sí, es nuestra especialidad. En Miami recomendamos tener ambas versiones para llegar a todos tus clientes.
  q_en: Can the site be in Spanish and English?
  a_en: Yes, that is our specialty. In Miami we recommend both versions to reach all your customers.
- q_es: ¿Hacen páginas para negocios de Hialeah, Doral o Kendall?
  a_es: Sí. Trabajamos con negocios de todo el condado y podemos destacar en tu página las zonas exactas donde das servicio.
  q_en: Do you build sites for businesses in Hialeah, Doral or Kendall?
  a_en: Yes. We work with businesses across the county and can highlight on your site the exact areas you serve.
