faq:
- q_es: ¿Qué incluye el CRM de $997?
  a_es: El tablero de inicio, clientes y prospectos, embudo de ventas, etapas por servicio, agenda y tareas con avisos, cobros con recibos en PDF, documentos privados, reportes, usuarios con roles y permisos, los formularios de tu sitio web conectados y la búsqueda rápida. También la migración de tu Excel, hasta 3 usuarios, la capacitación y 30 días de ajustes.
  q_en: What does the $997 CRM include?
  a_en: The home dashboard, customers and leads, sales pipeline, stages per service, calendar and tasks with reminders, payments with PDF receipts, private documents, reports, users with roles and permissions, your website forms connected and quick search. It also includes importing your spreadsheet, up to 3 users, training and 30 days of adjustments.
- q_es: ¿Es un programa con mensualidad, como HubSpot o GoHighLevel?
  a_es: No. Es tu propio sistema, hecho a medida y con pago único. La base de datos queda a tu nombre; sus planes empiezan gratis y los profesionales cuestan unos $25 al mes, que pagas directamente al proveedor.
  q_en: Is it a subscription software like HubSpot or GoHighLevel?
  a_en: No. It is your own system, custom-built with a one-time payment. The database is in your name; plans start free and professional plans run about $25 a month, paid directly to the provider.
- q_es: ¿Se puede conectar con WhatsApp, Instagram o un teléfono?
  a_es: Sí. Ya lo hemos conectado con WhatsApp Business, Messenger, Instagram, leads de Meta Ads, llamadas con Twilio, pagos con Square y Stripe, Google Calendar y un asistente con IA. Cada integración se cotiza según tu negocio, y el uso (mensajes, minutos o comisiones) se paga directamente a cada proveedor.
  q_en: Can it connect to WhatsApp, Instagram or a phone line?
  a_en: Yes. We have already connected it to WhatsApp Business, Messenger, Instagram, Meta Ads leads, Twilio calling, Square and Stripe payments, Google Calendar and an AI assistant. Each integration is quoted for your business, and usage (messages, minutes or fees) is paid directly to each provider.
- q_es: ¿Por qué no muestran ejemplos de clientes?
  a_es: Porque cada CRM guarda información privada de los clientes de cada negocio. En una videollamada te mostramos una demo con datos de ejemplo para que veas cómo funciona.
  q_en: Why don't you show client examples?
  a_en: Because every CRM holds private data about each business's customers. On a video call we show you a demo with sample data so you can see how it works.
- q_es: ¿Cuánto tarda y cómo se paga?
  a_es: Lo entregamos en 5 a 7 días desde que recibimos tu información. Se paga 50% para comenzar y 50% al entregarlo funcionando.
  q_en: How long does it take and how do I pay?
  a_en: We deliver it in 5 to 7 days after we receive your information. You pay 50% to start and 50% when it is delivered and working.
- q_es: ¿Mi equipo puede usarlo con permisos distintos?
  a_es: Sí. Cada persona entra con su propio correo y contraseña, y tú decides qué ve y qué puede hacer. Por ejemplo, un agente solo ve sus clientes y no ve montos. Los permisos se revisan en la base de datos, no solo en la pantalla.
  q_en: Can my team use it with different permissions?
  a_en: Yes. Each person signs in with their own email and password, and you decide what they see and do. For example, an agent sees only their own customers and no amounts. Permissions are enforced in the database, not just on screen.
