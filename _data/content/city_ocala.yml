faq:
- q_es: ¿Trabajan con negocios de Ocala y The Villages?
  a_es: 'Sí. Trabajamos con negocios de Ocala, The Villages, Belleview, Dunnellon y todo Marion County. Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte.'
  q_en: Do you work with businesses in Ocala and The Villages?
  a_en: 'Yes. We work with businesses in Ocala, The Villages, Belleview, Dunnellon and all of Marion County. We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere.'
- q_es: ¿Mi página puede estar solo en inglés?
  a_es: 'Claro. Hacemos la página en el idioma de tus clientes: solo inglés, solo español o ambos.'
  q_en: Can my site be English only?
  a_en: 'Of course. We build the site in your customers'' language: English only, Spanish only or both.'
- q_es: ¿Cuánto tarda?
  a_es: Una landing page en 24-48 horas y un sitio de varias páginas en 2-3 días.
  q_en: How long does it take?
  a_en: A landing page in 24-48 hours and a multi-page site in 2-3 days.
