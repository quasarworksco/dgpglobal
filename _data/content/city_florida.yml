faq:
- q_es: ¿En qué ciudades de Florida trabajan?
  a_es: 'En todo el estado: Miami, Orlando, Tampa, Fort Myers, Naples, Cape Coral, Ocala, Jacksonville y cualquier otra ciudad. Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte.'
  q_en: Which Florida cities do you work in?
  a_en: 'All over the state: Miami, Orlando, Tampa, Fort Myers, Naples, Cape Coral, Ocala, Jacksonville and any other city. We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere.'
- q_es: ¿Cuánto tarda una página web?
  a_es: La landing page se entrega en 24-48 horas, el sitio Estándar en 2-3 días y el Premium en 4-5 días.
  q_en: How long does a website take?
  a_en: A landing page is delivered in 24-48 hours, a Standard site in 2-3 days and Premium in 4-5 days.
- q_es: ¿Me ayudan a aparecer en Google en mi ciudad?
  a_es: Sí. Estructuramos tu página con tus servicios y tus zonas para Google y te guiamos con tu perfil de Google Business, que es clave para salir en el mapa.
  q_en: Will you help me show up on Google in my city?
  a_en: Yes. We structure your site with your services and service areas for Google and guide you on your Google Business Profile, which is key to showing up on the map.
