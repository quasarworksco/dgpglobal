faq:
- q_es: ¿Puedo recibir pedidos por WhatsApp en vez de pagos en línea?
  a_es: 'Sí. Muchas tiendas empiezan así: el cliente arma su pedido y te llega por WhatsApp con los productos, y tú confirmas el pago.'
  q_en: Can I take orders on WhatsApp instead of online payments?
  a_en: 'Yes. Many stores start that way: customers build their order and it reaches you on WhatsApp with the products, and you confirm payment.'
- q_es: ¿Me ayudan también a vender en Amazon o TikTok Shop?
  a_es: Sí. Tenemos un servicio de gestión e-commerce para abrir y optimizar tu cuenta en Amazon, Walmart, TikTok Shop, Shopify y eBay.
  q_en: Can you also help me sell on Amazon or TikTok Shop?
  a_en: Yes. Our e-commerce management service opens and optimizes your account on Amazon, Walmart, TikTok Shop, Shopify and eBay.
- q_es: ¿Cuántos productos puedo tener?
  a_es: Depende del plan y de cómo quieras administrarlos. Cuéntanos cuántos productos manejas y te recomendamos la mejor opción.
  q_en: How many products can I have?
  a_en: It depends on the plan and how you want to manage them. Tell us how many products you carry and we will recommend the best option.
