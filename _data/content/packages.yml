faq:
- q_es: ¿Qué incluye el Paquete Básico?
  a_es: Logo profesional, manual de marca, revisión de tus redes sociales, 1,000 seguidores y tarjeta de presentación, por $320 con entrega en 48 horas.
  q_en: What does the Basic Package include?
  a_en: Professional logo, brand guidelines, social media review, 1,000 followers and a business card, for $320 delivered in 48 hours.
- q_es: ¿Cuál es la diferencia entre los paquetes?
  a_es: El Intermedio ($480) incluye lo del Básico con 3,000 seguidores y 10 posts para Instagram. El Avanzado ($840) suma 5,000 seguidores, diseño de factura y business card, una web One Page y un panel de administración con CRM.
  q_en: What is the difference between the packages?
  a_en: Intermediate ($480) includes everything in Basic with 3,000 followers and 10 Instagram posts. Advanced ($840) adds 5,000 followers, invoice and business card design, a One Page website and an admin panel with CRM.
- q_es: ¿Cuánto cuesta cada paquete?
  a_es: 'Básico: $320. Intermedio: $480. Avanzado: $840. Es un pago único; escríbenos por WhatsApp y te ayudamos a elegir el que más te conviene.'
  q_en: How much does each package cost?
  a_en: 'Basic: $320. Intermediate: $480. Advanced: $840. One-time payment; message us on WhatsApp and we will help you choose the right one.'
- q_es: ¿Cómo se hace el pago?
  a_es: Aceptamos tarjeta de crédito, PayPal y Zelle.
  q_en: How do I pay?
  a_en: We accept credit card, PayPal and Zelle.
