faq:
- q_es: ¿Qué necesito para empezar la página de mi constructora?
  a_es: Tu logo, fotos de proyectos terminados, la lista de servicios, las ciudades donde trabajas y tu número de licencia si lo quieres mostrar. Si no tienes buenas fotos, te orientamos para tomarlas.
  q_en: What do I need to start my contractor website?
  a_en: Your logo, photos of finished projects, your list of services, the cities you work in and your license number if you want to show it. If you lack good photos, we guide you on taking them.
- q_es: ¿La página sirve para conseguir proyectos comerciales?
  a_es: Sí. Podemos separar servicios residenciales y comerciales, con un formulario para cada tipo de cliente.
  q_en: Does the site work for commercial projects too?
  a_en: Yes. We can separate residential and commercial services, with a form for each type of client.
- q_es: ¿Puedo actualizar la galería con obras nuevas?
  a_es: Sí. Nos mandas las fotos y las agregamos durante tu periodo de mantenimiento.
  q_en: Can I add new projects to the gallery?
  a_en: Yes. Send us the photos and we add them during your maintenance period.
