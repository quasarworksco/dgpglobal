faq:
- q_es: ¿Pueden poner mis licencias y seguros en la página?
  a_es: Sí. Mostrar licencias y seguros da confianza, sobre todo en construcción y reparaciones.
  q_en: Can you show my licenses and insurance on the site?
  a_en: Yes. Showing licenses and insurance builds trust, especially in construction and repairs.
- q_es: ¿Cuánto tarda mi página web?
  a_es: La tenemos lista para revisar en 24 horas desde que recibimos tu información. Tú la revisas, hacemos tus cambios y la publicamos.
  q_en: How long does my website take?
  a_en: It is ready to review 24 hours after we receive your information. You review it, we make your changes and we publish it.
- q_es: ¿Podemos reunirnos en persona?
  a_es: 'Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia.'
  q_en: Can we meet in person?
  a_en: 'We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely.'
