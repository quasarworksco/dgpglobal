faq:
- q_es: ¿Cuánto tarda en estar lista la página de mi taller?
  a_es: Una landing page se entrega en 24-48 horas y un sitio de varias páginas en 2-3 días, desde que tenemos tu logo, fotos del taller y la lista de servicios.
  q_en: How long does it take to build my shop's website?
  a_en: A landing page is delivered in 24-48 hours and a multi-page site in 2-3 days, once we have your logo, photos of the shop and your list of services.
- q_es: Soy mecánico móvil y no tengo local, ¿me sirve una página web?
  a_es: Sí. En lugar de una dirección mostramos las zonas donde atiendes y un botón para pedir el servicio por WhatsApp o llamada. Así hicimos la página de TECMECA, un taller eléctrico automotriz móvil en Texas.
  q_en: I'm a mobile mechanic with no shop. Is a website still worth it?
  a_en: Yes. Instead of an address we show the areas you cover and a button to request service by WhatsApp or phone. That is how we built the site for TECMECA, a mobile auto electrical shop in Texas.
- q_es: ¿Los clientes pueden pedir cita desde la página?
  a_es: Sí. Ponemos botones de WhatsApp y llamada en toda la página, y un formulario corto para que el cliente indique el vehículo y la falla antes de llegar.
  q_en: Can customers book an appointment from the site?
  a_en: Yes. We place WhatsApp and call buttons across the site, plus a short form where the customer describes the vehicle and the problem before coming in.
