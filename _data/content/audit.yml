faq:
- q_es: ¿La auditoría tiene algún costo?
  a_es: No. Es completamente gratis y sin compromiso de contratar nada.
  q_en: Does the audit cost anything?
  a_en: No. It's completely free with no obligation to hire anything.
- q_es: ¿Qué recibo exactamente?
  a_es: Un informe claro con lo que revisamos (velocidad, versión móvil, Google, conversión y diseño) y las mejoras concretas que más impacto tendrían en tu negocio. Te lo enviamos por correo o WhatsApp en menos de 24 horas.
  q_en: What exactly do I receive?
  a_en: A clear report covering what we reviewed (speed, mobile, Google, conversion and design) and the concrete improvements that would have the most impact on your business. We send it by email or WhatsApp within 24 hours.
- q_es: ¿Sirve para cualquier página web?
  a_es: 'Sí. No importa con qué se hizo tu sitio (WordPress, Wix, Shopify, código propio u otro): lo revisamos igual.'
  q_en: Does it work for any website?
  a_en: Yes. No matter what your site was built with (WordPress, Wix, Shopify, custom code or other), we review it all the same.
- q_es: ¿Y si todavía no tengo página web?
  a_es: 'Entonces no necesitas auditoría: mira nuestros planes de diseño web o usa el cotizador rápido para ver un estimado al instante.'
  q_en: What if I don't have a website yet?
  a_en: 'Then you don''t need an audit: check out our web design plans or use the quick quote tool for an instant estimate.'
