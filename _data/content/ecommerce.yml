faq:
- q_es: ¿El plan de gestión e-commerce es mensual?
  a_es: No. Es un pago único, sin mensualidades.
  q_en: Is the e-commerce management plan monthly?
  a_en: No. It is a one-time payment, with no monthly fees.
- q_es: ¿En qué plataformas trabajan?
  a_es: Amazon, Walmart, TikTok Shop, Shopify, eBay y otros marketplaces.
  q_en: Which platforms do you work with?
  a_en: Amazon, Walmart, TikTok Shop, Shopify, eBay and other marketplaces.
- q_es: ¿Qué incluye el servicio?
  a_es: Apertura y onboarding de tu cuenta, optimización de listings y catálogo, estrategia de precios, gestión de requisitos legales y permisos FDA, asesoría en publicidad (PPC) y acompañamiento estratégico personalizado.
  q_en: What does the service include?
  a_en: Account opening and onboarding, listing and catalog optimization, pricing strategy, legal requirements and FDA permit management, advertising (PPC) advisory and personalized strategic support.
- q_es: ¿Me ayudan con los permisos de la FDA?
  a_es: Sí. Gestionamos los requisitos legales y permisos FDA que tu producto necesite para venderse en las plataformas.
  q_en: Do you help with FDA permits?
  a_en: Yes. We manage the legal requirements and FDA permits your product needs to sell on the platforms.
