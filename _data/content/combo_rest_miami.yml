faq:
- q_es: ¿Pueden poner mi menú en dos idiomas?
  a_es: Sí. Tu menú queda en español e inglés, con precios y fotos, fácil de actualizar cuando cambies platos.
  q_en: Can you put my menu in two languages?
  a_en: Yes. Your menu goes up in English and Spanish, with prices and photos, and it is easy to update when dishes change.
- q_es: ¿Cuánto tarda mi página web?
  a_es: La tenemos lista para revisar en 24 horas desde que recibimos tu información.
  q_en: How long does my website take?
  a_en: It is ready to review 24 hours after we receive your information.
- q_es: ¿Podemos reunirnos en persona?
  a_es: 'Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia.'
  q_en: Can we meet in person?
  a_en: 'We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely.'
