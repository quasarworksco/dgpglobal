faq:
  - q_es: ¿En qué estado puedo registrar mi empresa?
    a_es: En cualquier estado de EE. UU. Nuestros aliados especializados hacen el trámite a distancia y los fees del Estado ya están incluidos en el precio. Si no sabes cuál te conviene, te orientamos antes de empezar.
    q_en: In which state can I register my company?
    a_en: In any U.S. state. Our specialized partners handle the filing remotely and state fees are already included in the price. If you are not sure which state is best for you, we guide you before starting.
  - q_es: ¿El precio incluye los fees del Estado?
    a_es: Sí. En cualquier estado, el Paquete Básico ($600) y el Premium ($950) ya incluyen los fees del Estado. No hay costos escondidos. El branding (logo) es adicional.
    q_en: Does the price include state fees?
    a_en: Yes. In any state, the Basic package ($600) and the Premium package ($950) already include the state fees. No hidden costs. Branding (logo) is extra.
  - q_es: ¿Puedo abrir una cuenta bancaria con estos documentos?
    a_es: Sí. Con el documento de formación de la empresa, el EIN y el Acuerdo Operativo notariado puedes abrir la cuenta bancaria de tu negocio.
    q_en: Can I open a bank account with these documents?
    a_en: Yes. With the company formation document, the EIN and the notarized Operating Agreement you can open your business bank account.
  - q_es: ¿Necesito número de Seguro Social para el EIN?
    a_es: Con número de Seguro Social el EIN suele salir rápido. Con ITIN o sin número también se puede solicitar, pero el IRS tarda más. Te explicamos el caso tuyo al cotizar.
    q_en: Do I need a Social Security number for the EIN?
    a_en: With a Social Security number the EIN is usually issued quickly. With an ITIN or no number it can still be requested, but the IRS takes longer. We explain your case when quoting.
  - q_es: ¿Qué diferencia hay entre el Paquete Básico y el Premium?
    a_es: El Básico ($600) incluye el registro de la empresa ante el Estado, el EIN ante el IRS y el Acuerdo Operativo completo y notariado. El Premium ($950) incluye todo eso más dominio empresarial, página web, hosting por 1 año, dirección virtual y perfil de Google Business para que tu negocio aparezca en Google y Google Maps.
    q_en: What is the difference between the Basic and Premium packages?
    a_en: Basic ($600) includes your company registration with the state, the EIN from the IRS and a complete, notarized Operating Agreement. Premium ($950) includes all of that plus a business domain, website, 1 year of hosting, a virtual address and a Google Business Profile so your business shows up on Google and Google Maps.
  - q_es: ¿Ustedes dan asesoría legal o fiscal?
    a_es: No. El registro lo realizan aliados especializados y nosotros te acompañamos en todo el proceso, además de tu página web y presencia en Google. Para asesoría legal o de impuestos te recomendamos consultar con un profesional.
    q_en: Do you provide legal or tax advice?
    a_en: No. The registration is handled by specialized partners and we take care of your website and Google presence. For legal or tax advice, we recommend consulting a professional.
