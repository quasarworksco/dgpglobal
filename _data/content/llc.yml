faq:
  - q_es: ¿En qué estado puedo registrar mi empresa?
    a_es: Nuestros paquetes Básico y Premium son para Texas, con los fees del Estado incluidos. También podemos registrarla en otro estado de EE. UU.; escríbenos y te cotizamos el total antes de empezar.
    q_en: In which state can I register my company?
    a_en: Our Basic and Premium packages are for Texas, with state fees included. We can also register it in another U.S. state; message us and we quote the total before starting.
  - q_es: ¿El precio incluye los fees del Estado?
    a_es: Sí. En Texas, el Paquete Básico ($600) y el Premium ($950) ya incluyen los fees del Estado. No hay costos escondidos. El branding (logo) es adicional.
    q_en: Does the price include state fees?
    a_en: Yes. In Texas, the Basic package ($600) and the Premium package ($950) already include the state fees. No hidden costs. Branding (logo) is extra.
  - q_es: ¿Puedo abrir una cuenta bancaria con estos documentos?
    a_es: Sí. Con el Certificate of Formation, el EIN y el Acuerdo Operativo notariado puedes abrir la cuenta bancaria de tu negocio.
    q_en: Can I open a bank account with these documents?
    a_en: Yes. With the Certificate of Formation, the EIN and the notarized Operating Agreement you can open your business bank account.
  - q_es: ¿Necesito número de Seguro Social para el EIN?
    a_es: Con número de Seguro Social el EIN suele salir rápido. Con ITIN o sin número también se puede solicitar, pero el IRS tarda más. Te explicamos el caso tuyo al cotizar.
    q_en: Do I need a Social Security number for the EIN?
    a_en: With a Social Security number the EIN is usually issued quickly. With an ITIN or no number it can still be requested, but the IRS takes longer. We explain your case when quoting.
  - q_es: ¿Qué diferencia hay entre el Paquete Básico y el Premium?
    a_es: El Básico ($600) incluye el registro de la empresa ante el Estado de Texas (Certificate of Formation), el EIN ante el IRS y el Acuerdo Operativo completo y notariado. El Premium ($950) incluye todo eso más dominio empresarial, página web, hosting por 1 año, dirección virtual y perfil de Google Business para que tu negocio aparezca en Google y Google Maps.
    q_en: What is the difference between the Basic and Premium packages?
    a_en: Basic ($600) includes your company registration with the State of Texas (Certificate of Formation), the EIN from the IRS and a complete, notarized Operating Agreement. Premium ($950) includes all of that plus a business domain, website, 1 year of hosting, a virtual address and a Google Business Profile so your business shows up on Google and Google Maps.
  - q_es: ¿Qué es el perfil empresarial?
    a_es: Es la preparación inicial de tu empresa ante los burós de crédito comerciales (Dun & Bradstreet y Experian Business), con orientación para empezar con proveedores que reportan crédito. Es una base para construir crédito de empresa; no se garantiza puntuación ni aprobación.
    q_en: What is the business profile?
    a_en: It is the initial setup of your company with the business credit bureaus (Dun & Bradstreet and Experian Business), with guidance to start with vendors that report credit. It is a foundation to build business credit; no score or approval is guaranteed.
  - q_es: ¿Ustedes dan asesoría legal o fiscal?
    a_es: No. El registro lo realizan aliados especializados y nosotros nos encargamos de tu página web y presencia en Google. Para asesoría legal o de impuestos te recomendamos consultar con un profesional.
    q_en: Do you provide legal or tax advice?
    a_en: No. The registration is handled by specialized partners and we take care of your website and Google presence. For legal or tax advice, we recommend consulting a professional.
