faq:
- q_es: ¿Trabajan con negocios de Kissimmee y Central Florida?
  a_es: 'Sí: Orlando, Kissimmee, Winter Park, Sanford, Lake Nona, Clermont y alrededores. Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte.'
  q_en: Do you work with businesses in Kissimmee and Central Florida?
  a_en: 'Yes: Orlando, Kissimmee, Winter Park, Sanford, Lake Nona, Clermont and nearby. We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere.'
- q_es: ¿Pueden agregar reservas en línea?
  a_es: Sí. El plan Premium incluye catálogo o sistema de reservas, ideal para servicios con cita.
  q_en: Can you add online booking?
  a_en: Yes. The Premium plan includes a catalog or booking system, ideal for appointment-based services.
- q_es: ¿La página puede estar en español y en inglés?
