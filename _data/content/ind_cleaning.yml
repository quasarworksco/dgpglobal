faq:
- q_es: ¿Cuánto tarda en estar lista la página de mi compañía de limpieza?
  a_es: Una landing page se entrega en 24-48 horas y un sitio de varias páginas en 2-3 días, desde que tenemos tu logo, fotos y servicios.
  q_en: How long does it take to build my cleaning company website?
  a_en: A landing page is delivered in 24-48 hours and a multi-page site in 2-3 days, once we have your logo, photos and services.
- q_es: ¿Pueden hacer la página en español e inglés?
  a_es: Sí. Somos una agencia bilingüe y muchas compañías de limpieza atienden clientes latinos y americanos, así que podemos tener ambas versiones.
  q_en: Can you build the site in English and Spanish?
  a_en: Yes. We are a bilingual agency, and many cleaning companies serve both Latino and American customers, so we can include both versions.
- q_es: ¿Me ayudan a aparecer en Google en mi ciudad?
  a_es: Construimos la página con tus servicios y zonas de servicio bien estructurados para Google, y te orientamos para completar tu perfil de Google Business, que es clave en búsquedas locales.
  q_en: Will you help me show up on Google in my city?
  a_en: We build the site with your services and service areas structured for Google, and we guide you to complete your Google Business Profile, which is key for local searches.
