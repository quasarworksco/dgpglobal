faq:
- q_es: ¿Atienden negocios de Naples y Cape Coral?
  a_es: 'Sí. Trabajamos con negocios de todo el suroeste de Florida: Fort Myers, Cape Coral, Naples, Bonita Springs, Estero y Lehigh Acres.'
  q_en: Do you work with businesses in Naples and Cape Coral?
  a_en: 'Yes. We work with businesses across Southwest Florida: Fort Myers, Cape Coral, Naples, Bonita Springs, Estero and Lehigh Acres.'
- q_es: ¿Podemos reunirnos en persona?
  a_es: 'Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte. Si lo prefieres, coordinamos una llamada para ver tu proyecto con calma.'
  q_en: Can we meet in person?
  a_en: 'We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere. If you prefer, we set up a call to go over your project in detail.'
- q_es: ¿Hacen páginas para contratistas y servicios del hogar?
  a_es: 'Sí, es uno de nuestros fuertes: galería de obras, licencias, zonas de servicio y formulario de estimado.'
  q_en: Do you build sites for contractors and home services?
  a_en: 'Yes, it is one of our strengths: project gallery, licenses, service areas and an estimate form.'
