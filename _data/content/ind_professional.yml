faq:
- q_es: ¿Pueden agregar un sistema de citas?
  a_es: Sí. Podemos integrar un formulario de citas o un sistema de reservas, según cuántas citas manejes al mes.
  q_en: Can you add an appointment system?
  a_en: Yes. We can integrate an appointment form or a booking system, depending on how many appointments you handle per month.
- q_es: Soy gestor de LLC o contador, ¿puedo ofrecer páginas web a mis clientes?
  a_es: Sí. Con nuestro programa de aliados revendes páginas web con tu marca y 25% de descuento, o solo nos recomiendas y ganas comisión.
  q_en: I'm an LLC agent or accountant. Can I offer websites to my clients?
  a_en: Yes. With our partner program you resell websites under your brand at 25% off, or simply refer clients and earn a commission.
- q_es: ¿La página puede estar en español y en inglés?
  a_es: 'Sí. Es una de nuestras especialidades: un mismo sitio con ambas versiones para llegar a todos tus clientes.'
  q_en: Can the site be in both Spanish and English?
  a_en: 'Yes. It is one of our specialties: one site with both versions to reach all your clients.'
