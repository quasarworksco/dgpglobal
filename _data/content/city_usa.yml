faq:
- q_es: ¿Trabajan con negocios fuera de Florida?
  a_es: 'Sí. Trabajamos con negocios de cualquier estado; por ejemplo, ya hicimos sitios para empresas en Georgia y Tennessee. Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte.'
  q_en: Do you work with businesses outside Florida?
  a_en: 'Yes. We work with businesses in any state; for example, we have built sites for companies in Georgia and Tennessee. We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere.'
- q_es: ¿Cómo es el proceso a distancia?
  a_es: Nos escribes por WhatsApp o el formulario, te enviamos una propuesta con precio y tiempo, pagas el 50% para empezar y te entregamos la página en el plazo acordado.
  q_en: How does the remote process work?
  a_en: You reach out on WhatsApp or the form, we send a proposal with price and timeline, you pay 50% to start and we deliver the site on the agreed date.
- q_es: ¿Atienden negocios latinos en otros estados?
  a_es: Sí. Somos una agencia bilingüe y muchos de nuestros clientes son negocios latinos que también quieren llegar a clientes americanos.
  q_en: Do you serve Latino businesses in other states?
  a_en: Yes. We are a bilingual agency and many of our clients are Latino-owned businesses that also want to reach American customers.
