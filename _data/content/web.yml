faq:
- q_es: ¿Cuánto cuesta una página web?
  a_es: 'Tenemos tres planes con pago único: Básico desde $280 (landing page + código QR), Estándar desde $455 (hasta 5 páginas con WhatsApp y formulario) y Premium desde $950 (catálogo o reservas, SEO, Google Analytics y 12 meses de hosting).'
  q_en: How much does a website cost?
  a_en: 'We have three one-time-payment plans: Basic from $280 (landing page + QR code), Standard from $455 (up to 5 pages with WhatsApp and contact form) and Premium from $950 (catalog or bookings, SEO, Google Analytics and 12 months of hosting).'
- q_es: ¿Cuánto tiempo tardan en entregarla?
  a_es: El plan Básico se entrega en 24-48 horas, el Estándar en 2-3 días y el Premium en 4-5 días.
  q_en: How long does delivery take?
  a_en: The Basic plan is delivered in 24-48 hours, Standard in 2-3 days and Premium in 4-5 days.
- q_es: ¿Incluye hosting y mantenimiento?
  a_es: 'Todos los planes incluyen un dominio gratis del tipo tunegocio.dgp-link.com. El Plan Premium además incluye 12 meses de hosting y mantenimiento; en los demás, el hosting se contrata aparte (desde $25 al mes o $145 al año). Si quieres un dominio propio (.com), te ayudamos a conseguirlo.'
  q_en: Is hosting and maintenance included?
  a_en: 'Every plan includes a free domain like yourbusiness.dgp-link.com. The Premium Plan also includes 12 months of hosting and maintenance; for the others, hosting is billed separately (from $25/month or $145/year). If you want your own domain (.com), we help you get it.'
- q_es: ¿Mi página se verá bien en el celular?
  a_es: Sí. Todos nuestros sitios se diseñan para verse y funcionar bien en celular, tablet y computadora.
  q_en: Will my website look good on mobile?
  a_en: Yes. All our websites are designed to look and work well on mobile, tablet and desktop.
- q_es: ¿Y si no me gusta el diseño?
  a_es: 'Tienes garantía de satisfacción: si el resultado no te convence, lo revisamos sin costo adicional.'
  q_en: What if I don't like the design?
  a_en: 'You''re covered by our satisfaction guarantee: if the result doesn''t convince you, we revise it at no extra cost.'
- q_es: ¿Ya tengo página web, pueden mejorarla?
  a_es: 'Sí. Empieza con nuestra auditoría web gratis: la revisamos y en menos de 24 horas te enviamos un informe con las mejoras que más impacto tendrían.'
  q_en: I already have a website, can you improve it?
  a_en: 'Yes. Start with our free website audit: we review it and within 24 hours send you a report with the improvements that would have the most impact.'
