faq:
- q_es: ¿Cuánto cuesta una página web profesional?
  a_es: 'Depende del tipo de sitio. Tenemos tres planes con pago único: Básico (landing page), Estándar (hasta 5 páginas) y Premium (sitio completo con catálogo o reservas). Usa el cotizador rápido para ver un estimado al instante o escríbenos y te enviamos una propuesta personalizada.'
  q_en: How much does a professional website cost?
  a_en: 'It depends on the type of site. We have three one-time-payment plans: Basic (landing page), Standard (up to 5 pages) and Premium (full site with catalog or bookings). Use the quick quote tool for an instant estimate, or write to us for a custom proposal.'
- q_es: ¿Cuánto tiempo tardan en hacer una página web?
  a_es: La landing page se entrega en 24-48 horas, el sitio Estándar en 2-3 días y el Premium en 4-5 días.
  q_en: How long does it take to build a website?
  a_en: Our landing page plan is delivered in 24-48 hours. Standard websites take 2-3 days and premium websites 4-5 days.
- q_es: ¿Trabajan con negocios fuera de Florida?
  a_es: Sí. Estamos en Florida, pero atendemos clientes en todo Estados Unidos, Latinoamérica y Europa. Todos nuestros servicios se entregan 100% en línea.
  q_en: Do you work with businesses outside of Florida?
  a_en: Yes. While we are based in Florida, USA, we serve clients across the United States, Latin America and Europe. All our services are delivered 100% online.
- q_es: ¿Atienden en español y en inglés?
  a_es: Sí. DGP Global Group es una agencia totalmente bilingüe y damos soporte completo en español y en inglés sin costo adicional.
  q_en: Do you offer support in Spanish and English?
  a_en: Yes. DGP Global Group is a fully bilingual agency. We provide complete support in both Spanish and English at no extra cost.
- q_es: ¿Qué garantía ofrecen?
  a_es: 'Garantía de satisfacción: si el resultado no te convence, lo revisamos sin costo adicional hasta que quedes conforme.'
  q_en: What is your satisfaction guarantee?
  a_en: We offer a full satisfaction guarantee. If you are not satisfied with the result, we will revise it at no additional cost until you are happy with the outcome.
- q_es: ¿Qué es la auditoría web gratis?
  a_es: 'Si ya tienes página web, la revisamos sin costo: velocidad, versión móvil, visibilidad en Google y qué tan bien convierte visitas en clientes. En menos de 24 horas te enviamos un informe con mejoras concretas, sin compromiso.'
  q_en: What is the free website audit?
  a_en: 'If you already have a website, we review it for free: speed, mobile experience, Google visibility and how well it turns visitors into customers. Within 24 hours we send you a report with concrete improvements, no commitment.'
