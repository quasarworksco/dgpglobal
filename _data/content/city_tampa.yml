faq:
- q_es: ¿Tienen clientes en Tampa Bay?
  a_es: 'Sí. Por ejemplo, hicimos la página de Smelling Clean, una compañía de limpieza en Riverview. Trabajamos 100% en línea desde Florida: nos reunimos por videollamada o WhatsApp y te entregamos todo a distancia, sin que tengas que desplazarte.'
  q_en: Do you have clients in Tampa Bay?
  a_en: 'Yes. For example, we built the website for Smelling Clean, a cleaning company in Riverview. We work 100% online from Florida: we meet by video call or WhatsApp and deliver everything remotely, so you never have to drive anywhere.'
- q_es: ¿Trabajan con negocios de St. Pete y Clearwater?
  a_es: 'Sí, con negocios de toda la bahía: Tampa, St. Petersburg, Clearwater, Brandon, Riverview y Wesley Chapel.'
  q_en: Do you work with businesses in St. Pete and Clearwater?
  a_en: 'Yes, with businesses across the bay: Tampa, St. Petersburg, Clearwater, Brandon, Riverview and Wesley Chapel.'
- q_es: ¿Cuánto tarda la página?
  a_es: Una landing page en 24-48 horas; un sitio de varias páginas en 2-3 días.
  q_en: How long does the website take?
  a_en: A landing page in 24-48 hours; a multi-page site in 2-3 days.
