faq:
- q_es: ¿La página funciona bien en el celular?
  a_es: Sí. Está pensada primero para el celular, con el botón de llamada siempre a la mano, porque ahí llegan la mayoría de las búsquedas urgentes.
  q_en: Does the site work well on mobile?
  a_en: Yes. It is designed mobile-first with the call button always at hand, because that is where most urgent searches come from.
- q_es: ¿Puedo recibir las solicitudes de servicio por WhatsApp?
  a_es: Sí. Los formularios pueden llegarte por correo y además tienes el botón de WhatsApp con un mensaje listo para que el cliente te escriba.
  q_en: Can I receive service requests on WhatsApp?
  a_en: Yes. Forms can reach you by email, and you also get a WhatsApp button with a ready-made message for customers.
- q_es: ¿Sirve para varios servicios, por ejemplo reparación y aire acondicionado?
  a_es: Sí. Con el Plan Estándar cada servicio puede tener su propia página, lo que también ayuda a aparecer en Google para cada uno.
  q_en: Does it work for several services, like repair and AC?
  a_en: Yes. With the Standard Plan each service can have its own page, which also helps you rank on Google for each one.
