faq:
- q_es: ¿Trabajan con negocios de Texas si están en Florida?
  a_es: 'Sí. Trabajamos 100% en línea con negocios de todo Estados Unidos, y tenemos clientes en Texas. Nos reunimos por videollamada o WhatsApp.'
  q_en: Do you work with Texas businesses if you are in Florida?
  a_en: 'Yes. We work 100% online with businesses across the US, and we have clients in Texas. We meet by video call or WhatsApp.'
- q_es: ¿Cuánto tarda mi página web?
  a_es: 'La tenemos lista para revisar en 24 horas desde que recibimos tu información.'
  q_en: How long does my website take?
  a_en: 'It is ready to review 24 hours after we receive your information.'
- q_es: ¿La página puede estar en español y en inglés?
  a_es: 'Sí. Todas nuestras páginas pueden ser bilingües, para que te encuentren clientes latinos y americanos.'
  q_en: Can my website be in English and Spanish?
  a_en: 'Yes. All our websites can be bilingual, so both Latino and American customers can find you.'
