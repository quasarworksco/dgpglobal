crm:
- slug: ava-multiservices
  title: AVA MULTISERVICES
  logo: logo.svg
  brand: '#736251'
  ink: '#2a2a2a'
  tags_es: [Taxes, Inmigración, LLC, Crédito]
  tags_en: [Taxes, Immigration, LLC, Credit]
  es: CRM para una oficina de taxes, trámites migratorios, LLC y reparación de crédito en Dallas. Cada servicio tiene su tablero de casos con su lista de documentos, y los mensajes de WhatsApp, Messenger e Instagram llegan a una sola bandeja.
  en: CRM for a Dallas tax, immigration, LLC and credit repair office. Each service has its own case board with its document checklist, and WhatsApp, Messenger and Instagram messages land in a single inbox.
  modules_es: [Casos por etapa, Bandeja de mensajes, Portal del cliente, Contratos con firma, Cobros y recibos, Documentos, Agenda y tareas, Campañas]
  modules_en: [Case boards, Unified inbox, Client portal, E-signed contracts, Payments & receipts, Documents, Calendar & tasks, Campaigns]
  shots:
  - [Inicio, Home]
  - [Casos por etapa, Case board]
  - [Clientes, Clients]
- slug: mq
  title: MQ STORE
  logo: logo.svg
  brand: '#1a4fd6'
  ink: '#0b2a5c'
  tags_es: [Call center, Ventas, Reclutamiento]
  tags_en: [Call center, Sales, Recruiting]
  es: CRM de ventas para un equipo de agentes que vende filtros de aire, purificadores y sistemas de agua. Llaman desde el computador con una cola de marcación priorizada, y cada venta calcula la comisión y queda conectada a la tienda MQ Store.
  en: Sales CRM for a team of agents selling air filters, purifiers and water systems. They call from the computer with a prioritized dial queue, and every sale calculates its commission and connects to the MQ Store shop.
  modules_es: [Modo llamadas, Teléfono integrado, Embudo de ventas, Productividad por agente, Reclutamiento, Ventas y comisiones, Recaudo y cartera, Tienda conectada]
  modules_en: [Call mode, Built-in phone, Sales pipeline, Agent productivity, Recruiting, Sales & commissions, Collections, Connected store]
  shots:
  - [Inicio, Home]
  - [Embudo de ventas, Sales pipeline]
  - [Clientes y prospectos, Customers & leads]
- slug: moya-company
  title: MOYA & COMPANY
  logo: logo.png
  brand: '#0930b9'
  ink: '#00227c'
  tags_es: [Asistencia virtual, Llamadas, Contenido]
  tags_en: [Virtual assistance, Calls, Content]
  es: Panel para una agencia de asistencia virtual. Reúne las visitas del sitio, las llamadas grabadas con resumen hecho por IA, la cartera de clientes y postulantes, y los diseños de redes que la clienta aprueba antes de publicar.
  en: Dashboard for a virtual assistance agency. It brings together website visits, recorded calls with AI summaries, the client and applicant pipeline, and the social media designs the owner approves before they go live.
  modules_es: [Resumen del día, Llamadas y SMS, Resumen con IA, Contactos y postulantes, Aprobación de diseños, Métricas del sitio, Redes sociales]
  modules_en: [Daily overview, Calls & SMS, AI call summaries, Contacts & applicants, Design approvals, Website analytics, Social media]
  shots:
  - [Resumen, Overview]
  - [Contactos, Contacts]
  - [Llamadas, Calls]
