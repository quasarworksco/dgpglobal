faq:
- q_es: ¿Pueden mostrar los cursos con sus precios y fechas?
  a_es: Sí. Cada curso puede tener su propia sección o página con precio, duración, horarios y próximas fechas de inicio.
  q_en: Can you show courses with prices and dates?
  a_en: Yes. Each course can have its own section or page with price, duration, schedule and upcoming start dates.
- q_es: ¿Se pueden inscribir los alumnos en línea?
  a_es: Sí. Agregamos un formulario de inscripción o reserva de cupo que te llega por correo, y un botón de WhatsApp para dudas.
  q_en: Can students enroll online?
  a_en: Yes. We add an enrollment or seat-reservation form that reaches you by email, plus a WhatsApp button for questions.
- q_es: ¿Sirve para escuelas de manejo, CDL o maquinaria pesada?
  a_es: 'Sí. Ya hicimos sitios para capacitación en maquinaria pesada y conocemos lo que buscan esos alumnos: práctica real, certificación y precios claros.'
  q_en: Does it work for driving, CDL or heavy equipment schools?
  a_en: 'Yes. We have built sites for heavy equipment training and know what those students look for: hands-on practice, certification and clear pricing.'
