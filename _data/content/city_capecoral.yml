faq:
- q_es: ¿Cuánto tarda mi página web?
  a_es: 'La tenemos lista para revisar en 24 horas desde que recibimos tu información. Tú la revisas, pedimos tus cambios y la publicamos.'
  q_en: How long does my website take?
  a_en: 'It is ready to review 24 hours after we receive your information. You review it, we make your changes and we publish it.'
- q_es: ¿Trabajan con negocios de construcción y servicios del hogar en Cape Coral?
  a_es: 'Sí. Es uno de nuestros fuertes: galería de obras, licencias, zonas de servicio y formulario de estimado.'
  q_en: Do you work with construction and home service businesses in Cape Coral?
