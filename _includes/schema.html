{% assign d = site.data.content[page.ref] %}{% assign L = page.lang %}
{% if d.service %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {% if L == 'en' %}{{ d.service.name_en | jsonify }}{% else %}{{ d.service.name_es | jsonify }}{% endif %},
  "serviceType": {{ d.service.type | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": "{{ site.url }}{{ page.url }}",
  "inLanguage": "{{ L }}",
  "areaServed": [{"@type": "State", "name": "Florida"}, {"@type": "Country", "name": "United States"}],
  "availableLanguage": ["es", "en"],
  "provider": {
    "@type": "ProfessionalService",
    "@id": "https://dgpglobalgroup.com/#business",
    "name": "DGP Global Group",
    "url": "https://dgpglobalgroup.com",
    "telephone": "+12398231738"
  }
}
</script>
{% endif %}
{% if page.ref != 'home' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "{% if L == 'en' %}Home{% else %}Inicio{% endif %}", "item": "{{ site.url }}{{ site.data.routes.home[L] }}"},
    {"@type": "ListItem", "position": 2, "name": {% if L == 'en' %}{{ d.crumb_en | jsonify }}{% else %}{{ d.crumb_es | jsonify }}{% endif %}, "item": "{{ site.url }}{{ page.url }}"}
  ]
}
</script>
{% endif %}
{% if d.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "{{ L }}",
  "mainEntity": [
{% for f in d.faq %}{% if L == 'en' %}    {"@type": "Question", "name": {{ f.q_en | jsonify }}, "acceptedAnswer": {"@type": "Answer", "text": {{ f.a_en | jsonify }}}}{% else %}    {"@type": "Question", "name": {{ f.q_es | jsonify }}, "acceptedAnswer": {"@type": "Answer", "text": {{ f.a_es | jsonify }}}}{% endif %}{% unless forloop.last %},{% endunless %}
{% endfor %}  ]
}
</script>
{% endif %}
